<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Agenda - SKEMA UNINDRA</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIG -->
  <script src="config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: #111;
      color: white;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }


    /* =========================
       BUTTON
    ========================= */

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #111;
      color: white;
    }

    .btn-edit {
      background: #eee;
      color: #111;
    }

    .btn-delete {
      background: #d33;
      color: white;
    }

    .btn-logout {
      background: white;
      color: #111;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: min(1100px, 94%);
      margin: 30px auto;
    }


    /* =========================
       LOGIN
    ========================= */

    .login-box {
      width: min(420px, 92%);
      margin: 80px auto;

      background: white;
      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.08);
    }

    .login-box h2 {
      margin-top: 0;
    }


    /* =========================
       FORM
    ========================= */

    label {
      display: block;

      font-weight: bold;
      font-size: 14px;

      margin-bottom: 6px;
    }

    input,
    textarea,
    select {

      width: 100%;

      padding: 11px;

      margin-bottom: 15px;

      border: 1px solid #ddd;

      border-radius: 8px;

      font: inherit;
    }


    /* =========================
       CARD
    ========================= */

    .card {

      background: white;

      padding: 22px;

      border-radius: 14px;

      margin-bottom: 20px;

      box-shadow:
        0 3px 15px rgba(0,0,0,.05);
    }


    /* =========================
       ADMIN
    ========================= */

    #admin-app {
      display: none;
    }


    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      min-width: 750px;
    }

    th,
    td {

      text-align: left;

      padding: 12px;

      border-bottom: 1px solid #eee;

      vertical-align: middle;
    }

    th {
      background: #f7f7f7;
    }


    /* =========================
       FOTO
    ========================= */

    .preview-img {

      width: 90px;
      height: 65px;

      object-fit: cover;

      border-radius: 8px;

      background: #eee;
    }

    .preview-large {

      width: 100%;

      max-width: 300px;

      max-height: 200px;

      object-fit: cover;

      border-radius: 10px;

      margin-top: 5px;

      display: none;
    }


    /* =========================
       ACTION
    ========================= */

    .actions {

      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }


    /* =========================
       MESSAGE
    ========================= */

    .error {

      color: #d00000;

      margin-top: 10px;

      font-size: 14px;
    }

    .success {

      color: #087a25;

      margin-top: 10px;

      font-size: 14px;
    }

    .info {

      color: #555;

      font-size: 13px;

      margin-top: -8px;

      margin-bottom: 15px;
    }


    /* =========================
       HIDDEN
    ========================= */

    .hidden {
      display: none !important;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {

        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       LOGIN
  ====================================== -->

  <div id="login-page">

    <div class="login-box">

      <h2>Login Pengurus</h2>

      <p>
        Masuk untuk mengelola agenda SKEMA UNINDRA.
      </p>


      <form id="login-form">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >


        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >


        <button
          type="submit"
          class="btn-primary"
          style="width:100%;"
        >
          Masuk
        </button>

      </form>


      <div id="login-error"></div>

    </div>

  </div>



  <!-- =====================================
       ADMIN
  ====================================== -->

  <div id="admin-app">


    <header>

      <h1>
        SKEMA UNINDRA — Agenda
      </h1>


      <button
        id="logout"
        class="btn-logout"
      >
        Keluar
      </button>

    </header>



    <main class="container">


      <!-- =================================
           TAMBAH AGENDA
      ================================== -->

      <div class="card">

        <h2>Tambah Agenda</h2>


        <form id="form-agenda">


          <label>
            Kegiatan
          </label>

          <input
            name="kegiatan"
            placeholder="Contoh: Seminar Nasional SKEMA"
            required
          >


          <label>
            Waktu
          </label>

          <input
            name="waktu"
            placeholder="Contoh: 10 Oktober 2026, 09.00 WIB"
          >


          <label>
            Jenis
          </label>

          <input
            name="jenis"
            placeholder="Seminar / Diskusi / Rapat"
          >


          <label>
            Foto Dokumentasi
          </label>

          <input
            type="file"
            id="foto-agenda"
            accept="image/*"
          >


          <div class="info">
            Pilih foto dari komputer. Foto akan otomatis diupload ke Supabase.
          </div>


          <img
            id="preview-foto"
            class="preview-large"
            alt="Preview foto"
          >


          <button
            type="submit"
            class="btn-primary"
            id="btn-simpan"
          >
            Tambah Agenda
          </button>


        </form>


        <div id="pesan-agenda"></div>

      </div>



      <!-- =================================
           DATA AGENDA
      ================================== -->

      <div class="card">

        <h2>Data Agenda</h2>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  Foto
                </th>

                <th>
                  Kegiatan
                </th>

                <th>
                  Waktu
                </th>

                <th>
                  Jenis
                </th>

                <th>
                  Aksi
                </th>

              </tr>

            </thead>


            <tbody id="data-agenda">

            </tbody>

          </table>

        </div>

      </div>


    </main>

  </div>



  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>


    // =====================================
    // KONEKSI SUPABASE
    // =====================================

    let sb = null;


    if (

      typeof SUPABASE_URL !== "undefined" &&

      typeof SUPABASE_ANON_KEY !== "undefined" &&

      SUPABASE_URL &&

      SUPABASE_ANON_KEY

    ) {

      sb = supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY

      );

    }


    // =====================================
    // ELEMENT
    // =====================================

    const loginPage =
      document.getElementById("login-page");

    const adminApp =
      document.getElementById("admin-app");

    const loginForm =
      document.getElementById("login-form");

    const loginError =
      document.getElementById("login-error");

    const logoutBtn =
      document.getElementById("logout");

    const formAgenda =
      document.getElementById("form-agenda");

    const fotoInput =
      document.getElementById("foto-agenda");

    const previewFoto =
      document.getElementById("preview-foto");

    const dataAgenda =
      document.getElementById("data-agenda");

    const btnSimpan =
      document.getElementById("btn-simpan");


    // =====================================
    // CEK SUPABASE
    // =====================================

    if (!sb) {

      loginError.className = "error";

      loginError.textContent =
        "Supabase belum terhubung. Cek config.js.";

    }


    // =====================================
    // ESCAPE HTML
    // =====================================

    function esc(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    // =====================================
    // PESAN
    // =====================================

    function tampilPesan(
      text,
      sukses = true
    ) {

      const el =
        document.getElementById(
          "pesan-agenda"
        );


      el.className =
        sukses
          ? "success"
          : "error";


      el.textContent = text;


      setTimeout(
        function() {

          el.textContent = "";

        },
        4000
      );

    }


    // =====================================
    // PREVIEW FOTO
    // =====================================

    fotoInput.addEventListener(
      "change",
      function() {

        const file =
          fotoInput.files[0];


        if (!file) {

          previewFoto.style.display =
            "none";

          previewFoto.src = "";

          return;

        }


        if (!file.type.startsWith("image/")) {

          alert(
            "File yang dipilih harus berupa gambar."
          );

          fotoInput.value = "";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            previewFoto.src =
              e.target.result;

            previewFoto.style.display =
              "block";

          };


        reader.readAsDataURL(file);

      }
    );


    // =====================================
    // LOGIN
    // =====================================

    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        if (!sb) {

          loginError.className =
            "error";

          loginError.textContent =
            "Supabase belum terhubung.";

          return;

        }


        loginError.className =
          "info";

        loginError.textContent =
          "Sedang masuk...";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const {
          data,
          error
        } = await sb.auth.signInWithPassword({

          email: email,

          password: password

        });


        if (error) {

          loginError.className =
            "error";

          loginError.textContent =
            error.message;

          return;

        }


        const userId =
          data.user.id;


        // CEK ADMIN

        const {
          data: adminData,
          error: adminError
        } = await sb

          .from("admin_users")

          .select("user_id")

          .eq(
            "user_id",
            userId
          )

          .maybeSingle();


        if (adminError) {

          await sb.auth.signOut();


          loginError.className =
            "error";


          loginError.textContent =
            "Gagal mengecek akses: " +
            adminError.message;


          return;

        }


        if (!adminData) {

          await sb.auth.signOut();


          loginError.className =
            "error";


          loginError.textContent =
            "Akun ini belum terdaftar sebagai pengurus.";


          return;

        }


        loginPage.style.display =
          "none";


        adminApp.style.display =
          "block";


        loginError.textContent = "";


        await muatAgenda();

      }
    );


    // =====================================
    // LOGOUT
    // =====================================

    logoutBtn.addEventListener(
      "click",
      async function() {

        if (sb) {

          await sb.auth.signOut();

        }


        adminApp.style.display =
          "none";


        loginPage.style.display =
          "block";


        document
          .getElementById("password")
          .value = "";

      }
    );


    // =====================================
    // UPLOAD FOTO
    // =====================================

    async function uploadFoto(file) {

      if (!file) {

        return null;

      }


      if (!file.type.startsWith("image/")) {

        throw new Error(
          "File harus berupa gambar."
        );

      }


      // Maksimal 5 MB

      if (file.size > 5 * 1024 * 1024) {

        throw new Error(
          "Ukuran foto maksimal 5 MB."
        );

      }


      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const namaFile =

        "agenda-" +

        Date.now() +

        "-" +

        Math.random()
          .toString(36)
          .substring(2, 8) +

        "." +

        ext;


      const path =
        namaFile;


      const {
        error
      } = await sb.storage

        .from("agenda-foto")

        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


      if (error) {

        throw error;

      }


      const {
        data
      } = sb.storage

        .from("agenda-foto")

        .getPublicUrl(path);


      return {
        url: data.publicUrl,
        path: path
      };

    }


    // =====================================
    // TAMBAH AGENDA
    // =====================================

    formAgenda.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        if (!sb) {

          tampilPesan(
            "Supabase belum terhubung.",
            false
          );

          return;

        }


        btnSimpan.disabled = true;

        btnSimpan.textContent =
          "Menyimpan...";


        try {

          const kegiatan =
            formAgenda.elements
              .kegiatan.value
              .trim();


          const waktu =
            formAgenda.elements
              .waktu.value
              .trim();


          const jenis =
            formAgenda.elements
              .jenis.value
              .trim();


          const file =
            fotoInput.files[0];


          let fotoUrl = null;


          // UPLOAD FOTO

          if (file) {

            btnSimpan.textContent =
              "Upload foto...";


            const hasil =
              await uploadFoto(file);


            fotoUrl =
              hasil.url;

          }


          // SIMPAN AGENDA

          btnSimpan.textContent =
            "Menyimpan agenda...";


          const {
            error
          } = await sb

            .from("agenda")

            .insert({

              kegiatan:
                kegiatan,

              waktu:
                waktu || null,

              jenis:
                jenis || null,

              foto:
                fotoUrl

            });


          if (error) {

            throw error;

          }


          // RESET

          formAgenda.reset();

          previewFoto.src = "";

          previewFoto.style.display =
            "none";


          tampilPesan(
            "Agenda dan foto berhasil disimpan."
          );


          await muatAgenda();

        }

        catch (error) {

          console.error(error);


          tampilPesan(
            "Gagal menyimpan: " +
            error.message,
            false
          );

        }

        finally {

          btnSimpan.disabled =
            false;

          btnSimpan.textContent =
            "Tambah Agenda";

        }

      }
    );


    // =====================================
    // MUAT AGENDA
    // =====================================

    async function muatAgenda() {

      dataAgenda.innerHTML =
        `<tr>
          <td colspan="5">
            Memuat data...
          </td>
        </tr>`;


      const {
        data,
        error
      } = await sb

        .from("agenda")

        .select("*")

        .order(
          "id",
          {
            ascending: false
          }
        );


      if (error) {

        dataAgenda.innerHTML =
          `<tr>
            <td
              colspan="5"
              class="error"
            >
              ${esc(error.message)}
            </td>
          </tr>`;

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        dataAgenda.innerHTML =
          `<tr>
            <td
              colspan="5"
              style="text-align:center;"
            >
              Belum ada agenda.
            </td>
          </tr>`;

        return;

      }


      dataAgenda.innerHTML =

        data.map(
          function(row) {

            let foto = "-";


            if (row.foto) {

              foto =

                `<img
                  src="${esc(row.foto)}"
                  class="preview-img"
                  alt="Foto agenda"
                  onerror="this.style.display='none'"
                >`;

            }


            return `

              <tr>

                <td>
                  ${foto}
                </td>


                <td>

                  <strong>
                    ${esc(row.kegiatan)}
                  </strong>

                </td>


                <td>
                  ${esc(row.waktu || "-")}
                </td>


                <td>
                  ${esc(row.jenis || "-")}
                </td>


                <td>

                  <div class="actions">

                    <button
                      class="btn-edit"
                      onclick="editAgenda(${row.id})"
                    >
                      Edit
                    </button>


                    <button
                      class="btn-delete"
                      onclick="hapusAgenda(${row.id})"
                    >
                      Hapus
                    </button>

                  </div>

                </td>

              </tr>

            `;

          }
        ).join("");

    }


    // =====================================
    // EDIT AGENDA
    // =====================================

    async function editAgenda(id) {

      const {
        data,
        error
      } = await sb

        .from("agenda")

        .select("*")

        .eq(
          "id",
          id
        )

        .single();


      if (error) {

        alert(error.message);

        return;

      }


      const kegiatan =
        prompt(
          "Kegiatan:",
          data.kegiatan
        );


      if (kegiatan === null) {
        return;
      }


      const waktu =
        prompt(
          "Waktu:",
          data.waktu || ""
        );


      if (waktu === null) {
        return;
      }


      const jenis =
        prompt(
          "Jenis:",
          data.jenis || ""
        );


      if (jenis === null) {
        return;
      }


      const gantiFoto =
        confirm(
          "Apakah ingin mengganti foto?"
        );


      let fotoBaru =
        data.foto;


      let fotoLama =
        data.foto;


      if (gantiFoto) {

        const input =
          document.createElement("input");


        input.type =
          "file";

        input.accept =
          "image/*";


        input.click();


        await new Promise(
          function(resolve) {

            input.onchange =
              resolve;

          }
        );


        const file =
          input.files[0];


        if (file) {

          try {

            const hasil =
              await uploadFoto(file);


            fotoBaru =
              hasil.url;

          }

          catch (uploadError) {

            alert(
              "Gagal upload foto: " +
              uploadError.message
            );

            return;

          }

        }

      }


      const {
        error: updateError
      } = await sb

        .from("agenda")

        .update({

          kegiatan:
            kegiatan,

          waktu:
            waktu || null,

          jenis:
            jenis || null,

          foto:
            fotoBaru

        })

        .eq(
          "id",
          id
        );


      if (updateError) {

        alert(
          updateError.message
        );

        return;

      }


      // HAPUS FOTO LAMA DARI STORAGE
      // Hanya kalau foto diganti

      if (
        gantiFoto &&
        fotoLama &&
        fotoBaru !== fotoLama
      ) {

        await hapusFotoDariStorage(
          fotoLama
        );

      }


      await muatAgenda();

    }


    // =====================================
    // AMBIL PATH DARI URL STORAGE
    // =====================================

    function ambilPathFoto(url) {

      if (!url) {
        return null;
      }


      const tanda =
        "/storage/v1/object/public/agenda-foto/";


      const posisi =
        url.indexOf(tanda);


      if (posisi === -1) {

        return null;

      }


      return url.substring(
        posisi + tanda.length
      );

    }


    // =====================================
    // HAPUS FOTO STORAGE
    // =====================================

    async function hapusFotoDariStorage(
      url
    ) {

      const path =
        ambilPathFoto(url);


      if (!path) {
        return;
      }


      const {
        error
      } = await sb.storage

        .from("agenda-foto")

        .remove([
          path
        ]);


      if (error) {

        console.error(
          "Gagal menghapus foto:",
          error
        );

      }

    }


    // =====================================
    // HAPUS AGENDA
    // =====================================

    async function hapusAgenda(id) {

      const yakin =
        confirm(
          "Yakin ingin menghapus agenda ini?"
        );


      if (!yakin) {
        return;
      }


      // Ambil data dulu
      // supaya foto juga bisa dihapus

      const {
        data,
        error: ambilError
      } = await sb

        .from("agenda")

        .select("foto")

        .eq(
          "id",
          id
        )

        .single();


      if (ambilError) {

        alert(
          ambilError.message
        );

        return;

      }


      // Hapus data agenda

      const {
        error
      } = await sb

        .from("agenda")

        .delete()

        .eq(
          "id",
          id
        );


      if (error) {

        alert(
          "Gagal menghapus: " +
          error.message
        );

        return;

      }


      // Hapus foto dari Storage

      if (data && data.foto) {

        await hapusFotoDariStorage(
          data.foto
        );

      }


      await muatAgenda();

    }


    // =====================================
    // CEK SESSION
    // =====================================

    async function cekSession() {

      if (!sb) {
        return;
      }


      const {
        data
      } = await sb.auth.getSession();


      if (!data.session) {
        return;
      }


      const userId =
        data.session.user.id;


      const {
        data: adminData
      } = await sb

        .from("admin_users")

        .select("user_id")

        .eq(
          "user_id",
          userId
        )

        .maybeSingle();


      if (!adminData) {

        await sb.auth.signOut();

        return;

      }


      loginPage.style.display =
        "none";


      adminApp.style.display =
        "block";


      await muatAgenda();

    }


    // =====================================
    // JALANKAN
    // =====================================

    cekSession();

  </script>

</body>

</html>
