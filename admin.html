<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin SKEMA UNINDRA</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .box {
      max-width: 720px;
      margin: 40px auto;
    }

    label {
      display: block;
      font: 500 15px var(--head);
      margin: 12px 0 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      font: 17px var(--body);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .row {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .row-content {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .row-info {
      flex: 1;
    }

    .row-photo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row button {
      font: 500 14px var(--head);
      padding: 6px 12px;
      cursor: pointer;
      border: 0;
    }

    #msg {
      color: var(--accent);
      font: 500 16px var(--head);
      min-height: 1.5em;
    }

    #form .btn {
      margin-top: 16px;
      border: 0;
      cursor: pointer;
    }

    .cancel {
      margin-top: 16px;
      margin-left: 8px;
      padding: 10px 16px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 6px;
    }

    .social-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .social-links a {
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="wrap box">

  <h1 style="font-size:40px;margin-bottom:8px">
    Admin SKEMA
  </h1>

  <p id="msg"></p>


  <!-- LOGIN -->

  <div id="login">

    <label for="em">
      Email Pengurus
    </label>

    <input
      id="em"
      type="email"
      autocomplete="username"
      required
    >

    <label for="pw">
      Kata Sandi
    </label>

    <input
      id="pw"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      class="btn"
      id="masuk"
      style="margin-top:16px;border:0;cursor:pointer"
    >
      Masuk
    </button>

  </div>


  <!-- PANEL ADMIN -->

  <div id="panel" hidden>

    <p>
      Login sebagai
      <strong id="admin-email"></strong>
    </p>

    <div
      class="tabs"
      id="tabs">
    </div>

    <div id="form"></div>

    <h2 style="font-size:26px;margin-top:32px">
      Data tersimpan
    </h2>

    <div id="list"></div>

    <button
      class="btn alt"
      id="keluar"
      style="margin-top:24px;cursor:pointer"
    >
      Keluar
    </button>

  </div>


  <p>
    <a href="index.html">
      Kembali ke website
    </a>
  </p>

</div>


<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="db.js"></script>


<script>

const S = {

  pengurus: {

    urut: "urutan",

    f: [
      ["nama", "Nama"],
      ["jabatan", "Jabatan"],
      ["divisi", "Divisi (kosongkan untuk pengurus inti)"],
      ["prodi", "Prodi"],
      ["angkatan", "Angkatan", "number"],
      ["urutan", "Urutan tampil", "number"],
      ["foto", "Link Foto"],
      ["instagram", "Link Instagram"],
      ["tiktok", "Link TikTok"],
      ["linkedin", "Link LinkedIn"]
    ]

  },

  agenda: {

    urut: "id",

    f: [
      ["kegiatan", "Kegiatan"],
      ["waktu", "Waktu"],
      ["jenis", "Jenis"]
    ]

  },

  karya: {

    urut: "id",

    f: [
      ["judul", "Judul"],
      ["jenis", "Jenis (Artikel / Policy brief / Poster)"],
      ["penulis", "Penulis"],
      ["tahun", "Tahun", "number"]
    ]

  }
    kajian: {

    urut: "urutan",

    f: [
      ["judul", "Judul Kajian"],
      ["bidang", "Bidang Kajian"],
      ["deskripsi", "Deskripsi"],
      ["penulis", "Penulis"],
      ["tahun", "Tahun", "number"],
      ["status", "Status"],
      ["urutan", "Urutan Tampil", "number"]
    ]

  }

};


let tabel = "pengurus";
let editId = null;


const msg = t => {
  $("msg").textContent = t || "";
};


function tampil(masuk) {

  $("login").hidden = masuk;
  $("panel").hidden = !masuk;

  if (masuk) {
    buatTab();
    muat();
  }

}


async function cekPengurus(userId) {

  const {
    data,
    error
  } = await sb
    .from("admin_users")
    .select("user_id")
    .eq("user_id", userId)
    .maybeSingle();

  if (error) {

    console.error(error);

    msg(
      "Gagal memeriksa akses pengurus: " +
      error.message
    );

    return false;

  }

  return !!data;

}


function buatTab() {

  $("tabs").innerHTML = "";

  Object.keys(S).forEach(k => {

    const b = el(
      "button",
      "",
      k[0].toUpperCase() + k.slice(1)
    );

    b.setAttribute(
      "aria-pressed",
      k === tabel
    );

    b.onclick = () => {

      tabel = k;
      editId = null;

      buatTab();
      muat();

    };

    $("tabs").appendChild(b);

  });

  buatForm();

}


function buatForm(data = null) {

  const f = $("form");

  f.innerHTML = "";

  S[tabel].f.forEach(
    ([k, label, tipe]) => {

      const i = el("input");

      i.id = "f-" + k;

      i.type = tipe || "text";

      if (
        k === "foto" ||
        k === "instagram" ||
        k === "tiktok" ||
        k === "linkedin"
      ) {

        i.placeholder = "https://...";

      }

      if (data && data[k] !== null && data[k] !== undefined) {
        i.value = data[k];
      }

      f.append(
        el("label", "", label),
        i
      );

    }
  );


  const b = el(
    "button",
    "btn",
    editId === null
      ? "Tambah"
      : "Simpan Perubahan"
  );

  b.type = "button";
  b.onclick = editId === null ? tambah : simpanEdit;

  f.appendChild(b);


  if (editId !== null) {

    const batal = el(
      "button",
      "cancel",
      "Batal Edit"
    );

    batal.type = "button";

    batal.onclick = () => {

      editId = null;

      buatForm();

      msg("");

    };

    f.appendChild(batal);

  }

}


function ambilDataForm() {

  const row = {};

  S[tabel].f.forEach(
    ([k, , tipe]) => {

      const v =
        $("f-" + k).value.trim();

      row[k] =
        tipe === "number"
          ? (v === "" ? null : Number(v))
          : v;

    }
  );

  return row;

}


async function tambah() {

  const row = ambilDataForm();

  const {
    error
  } = await sb
    .from(tabel)
    .insert(row);

  if (error) {

    msg(
      "Gagal: " +
      error.message
    );

    return;

  }

  msg(
    "Data berhasil ditambahkan."
  );

  buatForm();

  muat();

}


async function mulaiEdit(id) {

  const {
    data,
    error
  } = await sb
    .from(tabel)
    .select("*")
    .eq("id", id)
    .single();

  if (error) {

    msg(
      "Gagal mengambil data: " +
      error.message
    );

    return;

  }

  editId = id;

  buatForm(data);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  msg(
    "Mode edit aktif."
  );

}


async function simpanEdit() {

  if (editId === null) {
    return;
  }

  const row = ambilDataForm();

  const {
    error
  } = await sb
    .from(tabel)
    .update(row)
    .eq("id", editId);

  if (error) {

    msg(
      "Gagal menyimpan perubahan: " +
      error.message
    );

    return;

  }

  editId = null;

  msg(
    "Perubahan berhasil disimpan."
  );

  buatForm();

  muat();

}


async function hapusData(id) {

  if (
    !confirm(
      "Hapus data ini?"
    )
  ) {
    return;
  }

  const {
    error
  } = await sb
    .from(tabel)
    .delete()
    .eq("id", id);

  if (error) {

    msg(
      "Gagal: " +
      error.message
    );

    return;

  }

  if (editId === id) {
    editId = null;
    buatForm();
  }

  msg(
    "Data berhasil dihapus."
  );

  muat();

}


async function muat() {

  const {
    data,
    error
  } = await sb
    .from(tabel)
    .select("*")
    .order(S[tabel].urut);

  if (error) {

    msg(
      "Gagal mengambil data: " +
      error.message
    );

    return;

  }

  $("list").innerHTML = "";


  (data || []).forEach(r => {

    const d =
      el("div", "row");


    if (tabel === "pengurus") {

      const content =
        el("div", "row-content");


      if (r.foto) {

        const img =
          el("img", "row-photo");

        img.src = r.foto;

        img.alt =
          r.nama || "Foto pengurus";

        content.appendChild(img);

      }


      const info =
        el("div", "row-info");


      info.appendChild(
        el(
          "strong",
          "",
          r.nama || "-"
        )
      );


      info.appendChild(
        el(
          "div",
          "",
          [
            r.jabatan,
            r.divisi,
            r.prodi,
            r.angkatan
          ]
          .filter(Boolean)
          .join(" · ")
        )
      );


      ocials =
        el("div", "social-links");


      [
        ["Instagram", r.instagram],
        ["TikTok", r.tiktok],
        ["LinkedIn", r.linkedin]
      ]
      .forEach(([nama, link]) => {

        if (!link) return;

        const a =
          document.createElement("a");

        a.href = link;

        a.target = "_blank";

        a.rel =
          "noopener noreferrer";

        a.textContent = nama;

        socials.appendChild(a);

      });


      info.appendChild(socials);

      content.appendChild(info);


      const actions =
        el("div", "row-actions");


      const edit =
        el(
          "button",
          "",
          "Edit"
        );

      edit.onclick = () =>
        mulaiEdit(r.id);


      const hapus =
        el(
          "button",
          "",
          "Hapus"
        );

      hapus.onclick = () =>
        hapusData(r.id);


      actions.appendChild(edit);
      actions.appendChild(hapus);

      content.appendChild(actions);

      d.appendChild(content);

    } else {

      const content =
        el("div", "row-content");


      const info =
        el("div", "row-info");


      info.textContent =
        S[tabel].f
          .map(([k]) => r[k])
          .filter(
            x =>
              x !== null &&
              x !== ""
          )
          .join(" · ");


      const actions =
        el("div", "row-actions");


      const edit =
        el(
          "button",
          "",
          "Edit"
        );

      edit.onclick = () =>
        mulaiEdit(r.id);


      const hapus =
        el(
          "button",
          "",
          "Hapus"
        );

      hapus.onclick = () =>
        hapusData(r.id);


      actions.appendChild(edit);
      actions.appendChild(hapus);

      content.appendChild(info);
      content.appendChild(actions);

      d.appendChild(content);

    }


    $("list").appendChild(d);

  });

}


async function loginPengurus() {

  const email =
    $("em").value.trim();

  const password =
    $("pw").value;


  if (!email || !password) {

    msg(
      "Email dan kata sandi wajib diisi."
    );

    return;

  }


  msg(
    "Memeriksa akun..."
  );


  const {
    data,
    error
  } = await sb.auth
    .signInWithPassword({
      email,
      password
    });


  if (error) {

    msg(
      "Login gagal: " +
      error.message
    );

    return;

  }


  const user =
    data.user;


  const isAdmin =
    await cekPengurus(
      user.id
    );


  if (!isAdmin) {

    await sb.auth.signOut();

    msg(
      "Akses ditolak. Akun ini bukan akun pengurus."
    );

    return;

  }


  $("admin-email")
    .textContent =
    user.email || "-";


  msg(
    "Login pengurus berhasil."
  );


  tampil(true);

}


async function cekSession() {

  const {
    data
  } = await sb.auth
    .getSession();


  ession =
    data.session;


  if (!session) {

    tampil(false);

    return;

  }


  const isAdmin =
    await cekPengurus(
      session.user.id
    );


  if (!isAdmin) {

    await sb.auth.signOut();

    tampil(false);

    msg(
      "Akses ditolak. Halaman ini khusus pengurus."
    );

    return;

  }


  $("admin-email")
    .textContent =
    session.user.email || "-";


  tampil(true);

}


$("keluar").onclick =
  async () => {

    await sb.auth.signOut();

    window.location.href =
      "admin.html";

  };


if (!sb) {

  msg(
    "Konfigurasi Supabase belum tersedia."
  );

  $("masuk").disabled = true;

} else {

  $("masuk").onclick =
    loginPengurus;

  cekSession();

}

</script>

</body>

</html>
