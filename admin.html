<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin SKEMA UNINDRA</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

<main class="wrap" style="max-width:720px;padding-top:40px;padding-bottom:60px;">

  <!-- ================= LOGIN ================= -->

  <section id="loginBox">

    <div style="text-align:center;margin-bottom:30px;">

      <img
        src="skema.jpg"
        alt="Logo SKEMA"
        style="width:90px;height:90px;object-fit:cover;border-radius:20px;"
      >

      <h1 style="margin-bottom:8px;">
        Pengurus SKEMA
      </h1>

      <p style="color:#666;">
        Masuk untuk mengelola data SKEMA UNINDRA.
      </p>

    </div>


    <div class="card">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button
        id="loginBtn"
        class="btn"
        type="button"
        style="margin-top:15px;"
      >
        Login
      </button>


      <p
        id="loginMsg"
        style="margin-top:15px;"
      ></p>

    </div>

  </section>


  <!-- ================= ADMIN ================= -->

  <section id="adminBox" style="display:none;">

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:15px;
        margin-bottom:25px;
      "
    >

      <div>

        <h1 style="margin:0;">
          Dashboard Pengurus
        </h1>

        <p
          id="adminEmail"
          style="color:#666;margin:5px 0 0;"
        ></p>

      </div>


      <button
        id="logoutBtn"
        class="btn alt"
        type="button"
      >
        Logout
      </button>

    </div>


    <!-- ================= TAB ================= -->

    <div
      style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:20px;
      "
    >

      <button
        class="btn tabBtn"
        data-tab="pengurus"
        type="button"
      >
        Pengurus
      </button>


      <button
        class="btn tabBtn"
        data-tab="agenda"
        type="button"
      >
        Agenda
      </button>


      <button
        class="btn tabBtn"
        data-tab="karya"
        type="button"
      >
        Karya
      </button>


      <button
        class="btn tabBtn"
        data-tab="kajian"
        type="button"
      >
        Kajian
      </button>

    </div>


    <!-- ================= PANEL ================= -->

    <div class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
          margin-bottom:20px;
        "
      >

        <h2
          id="panelTitle"
          style="margin:0;"
        >
          Pengurus
        </h2>


        <button
          id="tambahBtn"
          class="btn"
          type="button"
        >
          + Tambah
        </button>

      </div>


      <!-- ================= FORM ================= -->

      <div
        id="formBox"
        style="
          display:none;
          margin-bottom:25px;
          padding:20px;
          border:1px solid #ddd;
          border-radius:14px;
        "
      >

        <h3
          id="formTitle"
          style="margin-top:0;"
        >
          Tambah Data
        </h3>


        <div id="formFields"></div>


        <div
          style="
            display:flex;
            gap:10px;
            margin-top:15px;
            flex-wrap:wrap;
          "
        >

          <button
            id="simpanBtn"
            class="btn"
            type="button"
          >
            Simpan
          </button>


          <button
            id="batalBtn"
            class="btn alt"
            type="button"
          >
            Batal
          </button>

        </div>


        <p
          id="formMsg"
          style="margin-top:12px;"
        ></p>

      </div>


      <!-- ================= DATA ================= -->

      <div id="dataList"></div>

    </div>

  </section>

</main>


<script>

/* ==================================================
   SUPABASE
================================================== */

let sb = null;


/*
  config.js harus berisi:

  window.SUPABASE_URL = "...";
  window.SUPABASE_ANON_KEY = "...";
*/

if (
  typeof window.SUPABASE_URL === "string" &&
  typeof window.SUPABASE_ANON_KEY === "string" &&
  window.SUPABASE_URL &&
  window.SUPABASE_ANON_KEY
) {

  sb = supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );

}


/* ==================================================
   KONFIGURASI TABEL
================================================== */

const S = {

  /* ================= PENGURUS ================= */

  pengurus: {

    urut: "urutan",

    f: [

      ["nama", "Nama"],

      ["jabatan", "Jabatan"],

      [
        "divisi",
        "Divisi (kosongkan untuk pengurus inti)"
      ],

      ["prodi", "Prodi"],

      ["angkatan", "Angkatan", "number"],

      ["urutan", "Urutan tampil", "number"],

      ["foto", "Link Foto"],

      ["instagram", "Link Instagram"],

      ["tiktok", "Link TikTok"],

      ["linkedin", "Link LinkedIn"]

    ]

  },


  /* ================= AGENDA ================= */

  agenda: {

    urut: "id",

    f: [

      ["kegiatan", "Kegiatan"],

      ["waktu", "Waktu"],

      ["jenis", "Jenis"],

      ["foto", "Link Foto Dokumentasi"]

    ]

  },


  /* ================= KARYA ================= */

  karya: {

    urut: "id",

    f: [

      ["judul", "Judul"],

      [
        "jenis",
        "Jenis (Artikel / Policy brief / Poster)"
      ],

      ["penulis", "Penulis"],

      ["tahun", "Tahun", "number"]

    ]

  },


  /* ================= KAJIAN ================= */

  kajian: {

    urut: "urutan",

    f: [

      ["judul", "Judul Kajian"],

      ["bidang", "Bidang Kajian"],

      ["deskripsi", "Deskripsi"],

      ["penulis", "Penulis"],

      ["tahun", "Tahun", "number"],

      ["status", "Status"],

      ["urutan", "Urutan Tampil", "number"]

    ]

  }

};


let tabelAktif = "pengurus";
let editId = null;


/* ==================================================
   HELPER
================================================== */

function $(id) {

  return document.getElementById(id);

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==================================================
   LOGIN
================================================== */

async function login() {

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  const msg =
    $("loginMsg");


  if (!email || !password) {

    msg.textContent =
      "Email dan password wajib diisi.";

    return;

  }


  if (!sb) {

    msg.textContent =
      "Supabase belum terhubung. Cek config.js.";

    return;

  }


  msg.textContent =
    "Memproses login...";


  try {

    const result =
      await sb.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (result.error) {

      throw result.error;

    }


    const user =
      result.data.user;


    if (!user) {

      throw new Error(
        "User tidak ditemukan."
      );

    }


    /* CEK ADMIN */

    const adminResult =
      await sb
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (adminResult.error) {

      throw adminResult.error;

    }


    if (!adminResult.data) {

      await sb.auth.signOut();

      throw new Error(
        "Akun ini bukan akun pengurus."
      );

    }


    /* MASUK ADMIN */

    $("loginBox").style.display =
      "none";

    $("adminBox").style.display =
      "block";

    $("adminEmail").textContent =
      user.email || "";


    await muat(tabelAktif);


  } catch (err) {

    console.error(err);

    msg.textContent =
      err.message ||
      "Login gagal.";

  }

}


/* LOGIN BUTTON */

$("loginBtn")
  .addEventListener(
    "click",
    login
  );


/* ENTER PASSWORD */

$("password")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {

        login();

      }

    }
  );


/* ==================================================
   LOGOUT
================================================== */

$("logoutBtn")
  .addEventListener(
    "click",
    async function() {

      if (sb) {

        await sb.auth.signOut();

      }


      $("adminBox").style.display =
        "none";

      $("loginBox").style.display =
        "block";

      $("email").value =
        "";

      $("password").value =
        "";

      $("loginMsg").textContent =
        "";

    }
  );


/* ==================================================
   TAB
================================================== */

document
  .querySelectorAll(".tabBtn")
  .forEach(
    function(btn) {

      btn.addEventListener(
        "click",
        async function() {

          tabelAktif =
            btn.dataset.tab;

          editId =
            null;


          $("formBox").style.display =
            "none";


          $("formMsg").textContent =
            "";


          $("panelTitle").textContent =
            btn.textContent.trim();


          await muat(
            tabelAktif
          );

        }
      );

    }
  );


/* ==================================================
   BUAT FORM
================================================== */

function buatForm(
  tabel,
  data = {}
) {

  const box =
    $("formFields");


  box.innerHTML =
    "";


  S[tabel].f.forEach(
    function(field) {

      const key =
        field[0];

      const label =
        field[1];

      const type =
        field[2];


      const wrap =
        document.createElement(
          "div"
        );


      wrap.style.marginBottom =
        "14px";


      const lab =
        document.createElement(
          "label"
        );


      lab.textContent =
        label;


      lab.style.display =
        "block";

      lab.style.marginBottom =
        "6px";


      wrap.appendChild(
        lab
      );


      let input;


      /* DESKRIPSI */

      if (
        key === "deskripsi"
      ) {

        input =
          document.createElement(
            "textarea"
          );

        input.rows =
          5;

      }


      /* INPUT BIASA */

      else {

        input =
          document.createElement(
            "input"
          );

        input.type =
          type || "text";

      }


      input.id =
        "field_" + key;


      input.value =
        data[key] ?? "";


      input.style.width =
        "100%";

      input.style.boxSizing =
        "border-box";


      /* FOTO */

      if (
        key === "foto"
      ) {

        input.placeholder =
          "Tempel link foto di sini";

      }


      /* SOCIAL MEDIA */

      if (
        key === "instagram" ||
        key === "tiktok" ||
        key === "linkedin"
      ) {

        input.placeholder =
          "https://...";

      }


      wrap.appendChild(
        input
      );


      box.appendChild(
        wrap
      );

    }
  );

}


/* ==================================================
   AMBIL DATA FORM
================================================== */

function ambilDataForm(
  tabel
) {

  const data = {};


  S[tabel].f.forEach(
    function(field) {

      const key =
        field[0];

      const type =
        field[2];


      const input =
        $("field_" + key);


      if (!input) {

        return;

      }


      let value =
        input.value.trim();


      if (
        type === "number"
      ) {

        value =
          value === ""
            ? null
            : Number(value);

      }


      data[key] =
        value;

    }
  );


  return data;

}


/* ==================================================
   TAMBAH DATA
================================================== */

async function tambah() {

  const msg =
    $("formMsg");


  if (!sb) {

    msg.textContent =
      "Supabase belum terhubung.";

    return;

  }


  const data =
    ambilDataForm(
      tabelAktif
    );


  msg.textContent =
    "Menyimpan...";


  try {

    const result =
      await sb
        .from(tabelAktif)
        .insert(data);


    if (result.error) {

      throw result.error;

    }


    $("formBox").style.display =
      "none";


    msg.textContent =
      "Data berhasil ditambahkan.";


    await muat(
      tabelAktif
    );


  } catch (err) {

    console.error(err);

    msg.textContent =
      err.message ||
      "Gagal menyimpan data.";

  }

}


/* ==================================================
   EDIT
================================================== */

function mulaiEdit(
  id,
  row
) {

  editId =
    id;


  $("formTitle").textContent =
    "Edit Data";


  $("formMsg").textContent =
    "";


  buatForm(
    tabelAktif,
    row
  );


  $("formBox").style.display =
    "block";


  $("formBox").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* ==================================================
   SIMPAN EDIT
================================================== */

async function simpanEdit() {

  if (!editId) {

    return;

  }


  const msg =
    $("formMsg");


  const data =
    ambilDataForm(
      tabelAktif
    );


  msg.textContent =
    "Menyimpan perubahan...";


  try {

    const result =
      await sb
        .from(tabelAktif)
        .update(data)
        .eq("id", editId);


    if (result.error) {

      throw result.error;

    }


    editId =
      null;


    $("formBox").style.display =
      "none";


    msg.textContent =
      "Perubahan berhasil disimpan.";


    await muat(
      tabelAktif
    );


  } catch (err) {

    console.error(err);

    msg.textContent =
      err.message ||
      "Gagal menyimpan perubahan.";

  }

}


/* ==================================================
   HAPUS
================================================== */

async function hapusData(
  id
) {

  const yakin =
    confirm(
      "Yakin ingin menghapus data ini?"
    );


  if (!yakin) {

    return;

  }


  try {

    const result =
      await sb
        .from(tabelAktif)
        .delete()
        .eq("id", id);


    if (result.error) {

      throw result.error;

    }


    await muat(
      tabelAktif
    );


  } catch (err) {

    console.error(err);

    alert(
      err.message ||
      "Gagal menghapus data."
    );

  }

}


/* ==================================================
   TAMPIL DATA
================================================== */

async function muat(
  tabel
) {

  const list =
    $("dataList");


  list.innerHTML =
    "Memuat data...";


  if (!sb) {

    list.innerHTML =
      `
      <p style="color:#b00020;">
        Supabase belum terhubung.
      </p>
      `;

    return;

  }


  try {

    const result =
      await sb
        .from(tabel)
        .select("*")
        .order(
          S[tabel].urut,
          {
            ascending: true
          }
        );


    if (result.error) {

      throw result.error;

    }


    const data =
      result.data || [];


    if (data.length === 0) {

      list.innerHTML =
        `
        <p style="color:#777;">
          Belum ada data.
        </p>
        `;

      return;

    }


    list.innerHTML =
      "";


    data.forEach(
      function(row) {

        const item =
          document.createElement(
            "div"
          );


        item.style.border =
          "1px solid #ddd";

        item.style.borderRadius =
          "12px";

        item.style.padding =
          "15px";

        item.style.marginBottom =
          "12px";


        const info =
          document.createElement(
            "div"
          );


        info.style.lineHeight =
          "1.7";


        /* =================
           PENGURUS
        ================= */

        if (
          tabel === "pengurus"
        ) {

          info.innerHTML =
            `
            <strong>
              ${escapeHtml(row.nama)}
            </strong>

            <br>

            ${escapeHtml(row.jabatan)}

            ${
              row.divisi
                ? " · " + escapeHtml(row.divisi)
                : ""
            }

            ${
              row.prodi
                ? "<br>" + escapeHtml(row.prodi)
                : ""
            }
            `;


          if (row.foto) {

            const img =
              document.createElement(
                "img"
              );


            img.src =
              row.foto;


            img.alt =
              "Foto " +
              (row.nama || "");


            img.style.width =
              "100px";

            img.style.height =
              "100px";

            img.style.objectFit =
              "cover";

            img.style.borderRadius =
              "12px";

            img.style.display =
              "block";

            img.style.marginTop =
              "10px";


            info.appendChild(
              img
            );

          }

        }


        /* =================
           AGENDA
        ================= */

        else if (
          tabel === "agenda"
        ) {

          info.innerHTML =
            `
            <strong>
              ${escapeHtml(row.kegiatan)}
            </strong>

            <br>

            ${escapeHtml(row.waktu)}

            ${
              row.jenis
                ? " · " + escapeHtml(row.jenis)
                : ""
            }
            `;


          /* FOTO AGENDA */

          if (row.foto) {

            const img =
              document.createElement(
                "img"
              );


            img.src =
              row.foto;


            img.alt =
              "Foto dokumentasi " +
              (row.kegiatan || "");


            img.style.width =
              "140px";

            img.style.height =
              "90px";

            img.style.objectFit =
              "cover";

            img.style.borderRadius =
              "10px";

            img.style.display =
              "block";

            img.style.marginTop =
              "10px";


            info.appendChild(
              img
            );

          }

        }


        /* =================
           KARYA / KAJIAN
        ================= */

        else {

          info.textContent =
            S[tabel].f
              .map(
                function(field) {

                  const key =
                    field[0];

                  const value =
                    row[key];


                  if (
                    value === null ||
                    value === undefined ||
                    value === ""
                  ) {

                    return null;

                  }


                  return value;

                }
              )
              .filter(
                Boolean
              )
              .join(" · ");

        }


        item.appendChild(
          info
        );


        /* =================
           BUTTON
        ================= */

        const actions =
          document.createElement(
            "div"
          );


        actions.style.display =
          "flex";

        actions.style.gap =
          "8px";

        actions.style.marginTop =
          "12px";


        const edit =
          document.createElement(
            "button"
          );


        edit.className =
          "btn";

        edit.type =
          "button";

        edit.textContent =
          "Edit";


        edit.addEventListener(
          "click",
          function() {

            mulaiEdit(
              row.id,
              row
            );

          }
        );


        const del =
          document.createElement(
            "button"
          );


        del.className =
          "btn alt";

        del.type =
          "button";

        del.textContent =
          "Hapus";


        del.addEventListener(
          "click",
          function() {

            hapusData(
              row.id
            );

          }
        );


        actions.appendChild(
          edit
        );

        actions.appendChild(
          del
        );


        item.appendChild(
          actions
        );


        list.appendChild(
          item
        );

      }
    );


  } catch (err) {

    console.error(err);


    list.innerHTML =
      `
      <p style="color:#b00020;">
        ${escapeHtml(
          err.message ||
          "Gagal memuat data."
        )}
      </p>
      `;

  }

}


/* ==================================================
   TAMBAH
================================================== */

$("tambahBtn")
  .addEventListener(
    "click",
    function() {

      editId =
        null;


      $("formTitle").textContent =
        "Tambah " +
        $("panelTitle").textContent;


      $("formMsg").textContent =
        "";


      buatForm(
        tabelAktif
      );


      $("formBox").style.display =
        "block";


      $("formBox").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }
  );


/* ==================================================
   BATAL
================================================== */

$("batalBtn")
  .addEventListener(
    "click",
    function() {

      editId =
        null;


      $("formBox").style.display =
        "none";


      $("formMsg").textContent =
        "";

    }
  );


/* ==================================================
   SIMPAN
================================================== */

$("simpanBtn")
  .addEventListener(
    "click",
    async function() {

      if (editId) {

        await simpanEdit();

      } else {

        await tambah();

      }

    }
  );


/* ==================================================
   CEK SESSION
================================================== */

async function cekSession() {

  if (!sb) {

    return;

  }


  try {

    const result =
      await sb.auth.getSession();


    if (
      result.error
    ) {

      console.error(
        result.error
      );

      return;

    }


    const session =
      result.data.session;


    if (!session) {

      return;

    }


    const user =
      session.user;


    const adminResult =
      await sb
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (
      adminResult.error ||
      !adminResult.data
    ) {

      await sb.auth.signOut();

      return;

    }


    $("loginBox").style.display =
      "none";


    $("adminBox").style.display =
      "block";


    $("adminEmail").textContent =
      user.email || "";


    await muat(
      tabelAktif
    );


  } catch (err) {

    console.error(err);

  }

}


/* JALANKAN */

cekSession();

</script>

</body>
</html>
