<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Member – SKEMA UNINDRA</title>
  <link rel="icon" href="skema.jpg">
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-box {
      max-width: 480px;
      margin: 70px auto;
    }

    .auth-box input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .auth-box label {
      display: block;
      margin-top: 16px;
      font-weight: 500;
    }

    .auth-box button {
      margin-top: 22px;
      border: 0;
      cursor: pointer;
    }

    #msg {
      min-height: 24px;
      margin-top: 15px;
    }
  </style>

</head>

<body>

<div class="wrap auth-box">

  <img src="skema.jpg" alt="Logo SKEMA" style="width:80px">

  <h1>Login Member</h1>

  <p class="lead">
    Masuk ke akun member SKEMA UNINDRA.
  </p>

  <form id="loginForm">

```
<label for="email">Email</label>
<input id="email" type="email" required>

<label for="password">Kata Sandi</label>
<input id="password" type="password" required>

<button class="btn" type="submit">
  Masuk
</button>
```

  </form>

  <p id="msg"></p>

  <p>
    Belum punya akun?
    <a href="register.html">Daftar sekarang</a>
  </p>

  <p>
    <a href="index.html">← Kembali ke website</a>
  </p>

</div>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  msg.textContent = "Memeriksa akun...";

  const { data, error } = await sb.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    msg.textContent = "Login gagal: " + error.message;
    return;
  }

  window.location.href = "member.html";
});
</script>

</body>
</html>
