name: Clean Code Fences

on: push

permissions:
contents: write

jobs:
clean:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

````
  - name: Remove code fences
    run: python3 -c "from pathlib import Path; exts={'.html','.css','.js','.json','.sql','.txt'}; [p.write_text(p.read_text(encoding='utf-8').replace('```',''),encoding='utf-8') for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in exts and '.git' not in p.parts]"

  - name: Commit
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      git diff --cached --quiet || git commit -m "Auto remove code fences"
      git push
````
