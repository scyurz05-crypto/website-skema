name: Auto Clean Code Fences

on:
push:
branches:
- main

permissions:
contents: write

jobs:
clean:
if: github.actor != 'github-actions[bot]'
runs-on: ubuntu-latest

````
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Clean code fences
    run: |
      python3 - <<'PY'
      from pathlib import Path

      extensions = {
          ".html",
          ".css",
          ".js",
          ".json",
          ".sql",
          ".txt"
      }

      for file in Path(".").rglob("*"):
          if not file.is_file():
              continue

          if ".git" in file.parts:
              continue

          if file.suffix.lower() not in extensions:
              continue

          try:
              text = file.read_text(encoding="utf-8")
          except UnicodeDecodeError:
              continue

          cleaned = text.replace("```html", "")
          cleaned = cleaned.replace("```HTML", "")
          cleaned = cleaned.replace("```css", "")
          cleaned = cleaned.replace("```CSS", "")
          cleaned = cleaned.replace("```javascript", "")
          cleaned = cleaned.replace("```JavaScript", "")
          cleaned = cleaned.replace("```js", "")
          cleaned = cleaned.replace("```JS", "")
          cleaned = cleaned.replace("```sql", "")
          cleaned = cleaned.replace("```SQL", "")
          cleaned = cleaned.replace("```json", "")
          cleaned = cleaned.replace("```JSON", "")
          cleaned = cleaned.replace("```", "")

          if cleaned != text:
              file.write_text(cleaned, encoding="utf-8")
              print("Dibersihkan:", file)

      PY

  - name: Commit cleaned files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add .

      if git diff --cached --quiet; then
        echo "Tidak ada yang perlu dibersihkan."
      else
        git commit -m "Auto clean code fences"
        git push
      fi
````
