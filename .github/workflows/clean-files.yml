name: Clean Code Fences

on:
push:
branches:
- main

permissions:
contents: write

jobs:
clean:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Clean files
    shell: bash
    run: |
      find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.sql" -o -name "*.txt" \) \
        -not -path "./.git/*" \
        -exec sed -i 's/```//g' {} +

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      git diff --cached --quiet || git commit -m "Auto remove code fences"
      git push
